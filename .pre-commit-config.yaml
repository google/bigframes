# NOTE: Package versions in this file are synchronized with noxfile.py.
# Run `python scripts/sync_pre_commit.py` or `nox -s format` to update.

default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        name: ruff lint
        args:
          - --fix
          - --select=I,F
          - --target-version=py311
          - --line-length=88
        files: ^(docs|bigframes|scripts|tests|third_party)/|^(noxfile|setup)\.py$
      - id: ruff-format
        name: ruff format
        args:
          - --target-version=py311
          - --line-length=88
        files: ^(docs|bigframes|scripts|tests|third_party)/|^(noxfile|setup)\.py$

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.4.1
    hooks:
      - id: pyrefly-check
        name: pyrefly
        pass_filenames: false
        additional_dependencies:
          - anywidget>=0.9.21
          - atpublic>=5.1,<6
          - db-dtypes>=1.9.0
          - freezegun>=1.5.5
          - fsspec>=2023.3.0
          - gcsfs>=2023.3.0,!=2025.5.0,!=2026.2.0,!=2026.3.0
          - geopandas>=1.0.0
          - google-cloud-bigquery-connection>=1.23.0
          - google-cloud-bigquery-storage>=2.43.0,<3.0.0
          - google-cloud-bigquery[bqstorage,pandas]>=3.47.0
          - google-cloud-functions>=1.25.0
          - google-cloud-resource-manager>=1.19.0
          - google-cloud-storage>=2.0.0
          - google-cloud-testutils
          - google-crc32c>=1.8.0,<2.0.0
          - grpc-google-iam-v1>=0.14.6
          - humanize>=4.6.0
          - jinja2
          - matplotlib>=3.7.1
          - mock
          - numpy>=1.24.1
          - openpyxl
          - pandas-gbq>=0.26.1
          - pandas-stubs<=2.2.3.241126
          - pandas>=1.5.3
          - pluggy
          - polars>=1.21.0,<2.0.0
          - pytest-cov
          - pytest-retry
          - pytest-snapshot>=0.9.0
          - pytest-timeout
          - pytest-xdist
          - pytest==8.4.2
          - python-dateutil>=2.8.2,<3
          - requests>=2.34.2
          - rich>=13.9.4,<14
          - scikit-learn>=1.8.0
          - shapely>=2.0.0
          - tabulate>=0.9
          - toolz>=0.11,<2
          - traitlets>=5.0.0
          - types-protobuf
          - types-python-dateutil
          - types-PyYAML
          - types-requests
          - types-setuptools
          - types-tabulate
          - typing-extensions>=4.6.1,<5
          - tzdata>=2025.2
          - xarray

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        name: conventional commits
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: check-pre-commit-sync
        name: check pre-commit versions sync with noxfile.py
        entry: python3 scripts/sync_pre_commit.py --check
        language: python
        files: ^(noxfile\.py|setup\.py|pyproject\.toml|\.pre-commit-config\.yaml|scripts/sync_pre_commit\.py)$
        pass_filenames: false
